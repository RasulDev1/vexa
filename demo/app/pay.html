<script>
// Тема та же, что у демо магазина и CRM
(function () {
  var theme = "light";
  try { theme = JSON.parse(localStorage.getItem("vexademo_theme")) || "light"; } catch (e) {}
  document.documentElement.dataset.theme = theme === "dark" ? "dark" : "light";
})();
</script>
<style>
  .pay-wrap { max-width: 440px; margin: 0 auto; padding: 28px 16px 60px; }
  .pay-card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 22px 20px; margin-top: 18px; }
  .pay-card h2 { font: 800 20px/1.2 var(--display); margin: 0 0 6px; }
  .pay-sum { font: 800 32px/1.1 var(--display); margin: 14px 0 4px; }
  .pay-note { color: var(--muted); font-size: 14px; margin: 10px 0 0; }
  .pay-ok { color: var(--ok); }
  .pay-wrap .ghost { width: 100%; }
</style>
<!-- Модули ссылаются друг на друга с ?v=20261001b, карта подменяет адрес на свежий -->

<div class="demo-bar" role="note"><span class="demo-bar-text"><b>Демо-оплата.</b> Тестовый Stripe, деньги не списываются.</span></div>
<main class="pay-wrap">
  <h1 class="brand">VEXA<span class="men">MEN</span></h1>

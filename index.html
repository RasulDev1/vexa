<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VEXA — мужская спортивная одежда</title>
<link rel="stylesheet" href="css/app.css?v=20261018w">
<link rel="stylesheet" href="css/chat.css?v=20261020a">
<link rel="stylesheet" href="css/orders.css?v=20261020a">
<!-- Шрифты лежат на сайте (fonts/); кириллицу просим сразу, чтобы текст не перерисовывался -->
<link rel="stylesheet" href="css/fonts.css?v=20261020a">
<link rel="preload" href="fonts/manrope-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/unbounded-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
<!-- Соединение с базой открываем заранее, пока грузятся скрипты -->
<link rel="preconnect" href="https://ztcltngfpnhhuzyyqnfw.supabase.co" crossorigin>
<!-- API мини-приложения Telegram -->
<script src="https://telegram.org/js/telegram-web-app.js" defer></script>
<!-- Supabase JS SDK 2.49.4 (заказы, роли, Realtime) лежит на самом сайте: CDN у части покупателей недоступен без VPN.
     Если файла вдруг нет, js/supabase.js подгрузит библиотеку с CDN. -->
<script src="js/vendor/supabase.js" defer></script>
<!-- Свежие версии скриптов: модули ссылаются друг на друга с ?v=20261001b, а карта подменяет адрес на новый.
     При следующем обновлении сайта достаточно поменять версию справа (и у main.js ниже) — браузер и Telegram скачают файлы заново. -->
<script type="importmap">
{
  "imports": {
    "./js/cart.js?v=20261001b": "./js/cart.js?v=20261020e",
    "./js/catalog.js?v=20261001b": "./js/catalog.js?v=20261020a",
    "./js/chat.js?v=20261001b": "./js/chat.js?v=20261020a",
    "./js/config.js?v=20261001b": "./js/config.js?v=20261020a",
    "./js/core.js?v=20261001b": "./js/core.js?v=20261020a",
    "./js/data.js?v=20261001b": "./js/data.js?v=20261020a",
    "./js/github.js?v=20261001b": "./js/github.js?v=20261020a",
    "./js/main.js?v=20261001b": "./js/main.js?v=20261020a",
    "./js/nav.js?v=20261001b": "./js/nav.js?v=20261020a",
    "./js/photos.js?v=20261001b": "./js/photos.js?v=20261020a",
    "./js/shop.js?v=20261001b": "./js/shop.js?v=20261020a",
    "./js/size-chart.js?v=20261001b": "./js/size-chart.js?v=20261020a",
    "./js/reviews.js?v=20261001b": "./js/reviews.js?v=20261020a",
    "./js/state.js?v=20261001b": "./js/state.js?v=20261020a",
    "./js/supabase.js?v=20261001b": "./js/supabase.js?v=20261020e"
  }
}
</script>
<script type="module" src="js/main.js?v=20261020a"></script>
<link rel="modulepreload" href="js/config.js?v=20261020a">
<link rel="modulepreload" href="js/core.js?v=20261020a">
<link rel="modulepreload" href="js/data.js?v=20261020a">
<link rel="modulepreload" href="js/state.js?v=20261020a">
<link rel="modulepreload" href="js/catalog.js?v=20261020a">

<link rel="modulepreload" href="js/chat.js?v=20261020a">
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="hero-top">
      <h1 class="brand">VEXA<span class="men">MEN</span></h1>
      <address class="shop" id="shopAddress"><span>Краснодар,<br>ул.&nbsp;Моя Выдумка&nbsp;67</span><span class="hours"><i>Ежедневно</i> <i>9:00–19:00</i></span></address>
    </div>
    <div class="lanes" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
    <p class="tag" id="greeting">Мужская одежда для бега, зала и улицы</p>
    <a class="staff-entry" id="staffEntry" href="crm.html" hidden>Для сотрудников →</a>
  </header>

  <nav class="tabs" id="tabs" aria-label="Разделы">
    <button class="tab" data-tab="cart" aria-pressed="false">Корзина<span id="cartTabCount"></span></button>
    <button class="tab" data-tab="orders" aria-pressed="false">Мои заказы</button>
    <button class="tab" data-tab="shop" aria-pressed="true">Товары</button>
  </nav>
  <div id="shopPage">
    <div class="cats-bar">
      <nav class="cats" id="categories" aria-label="Категории"></nav>
    </div>
    <main class="grid" id="grid"></main>
  </div>
  <section class="page" id="cartPage" hidden></section>
  <section class="page" id="ordersPage" hidden></section>
  <p class="disclaimer">Сайт является демонстрационным шаблоном. Все совпадения с реальными брендами случайны</p>
</div>

<div class="cartbar" id="cartBar"><button id="cartBarButton"><span id="cartBarText">Корзина</span><span id="cartBarTotal"></span></button></div>

<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true">
  <button class="close" id="closeSheet" aria-label="Закрыть">✕</button>
  <div class="sheet-inner" id="sheetBody"></div>
</section>
<div class="toast" id="toast" role="status"></div>
</body>
</html>
